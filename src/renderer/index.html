<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bofo - Your Personal AI Financial Manager" />
  <meta name="theme-color" content="#f8fafc" />
  <title>Bofo - AI Finance</title>

  <link rel="icon" type="image/x-icon" href="/assets/icons/icon.ico" />

  <!-- Security: Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; 
            script-src 'self' 'unsafe-inline' 'unsafe-eval'; 
            style-src 'self' 'unsafe-inline'; 
            img-src 'self' data: https:; 
            font-src 'self' data:; 
            connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* https://api.currencyapi.com https://api.frankfurter.app;" />

  <!-- Theme Initialization -->
  <script>
    (function () {
      const cachedTheme = localStorage.getItem('bofo_theme_cache');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = cachedTheme || (prefersDark ? 'dark' : 'light');

      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>

  <!-- Critical CSS for Startup Loader -->
  <style>
    .loader-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .loader-overlay.hidden {
      display: none !important;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid #e2e8f0;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- Application Entry -->
  <script type="module" src="./main.tsx"></script>
</head>

<body>
  <!-- Main Mount Point -->
  <div id="app" class="h-screen w-screen bg-surface-base"></div>

  <!-- Dynamic Overlay Containers -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Notification Modal -->
  <div id="notification-modal"
    class="modal fixed inset-0 bg-black/85 backdrop-blur-sm z-[3000] flex items-center justify-center transition-all duration-300 hidden opacity-0 invisible pointer-events-none">
    <div
      class="modal-content bg-surface-card w-[90%] max-w-md p-8 rounded-lg border border-border shadow-lg relative animate-[modalSlideUp_0.4s_ease-out]">
      <div class="flex flex-col items-center text-center">
        <div id="notification-icon" class="w-16 h-16 rounded-full flex items-center justify-center mb-6">
        </div>
        <h2 id="notification-title" class="text-2xl font-bold text-text-primary mb-3">Notification</h2>
        <p id="notification-message" class="text-text-muted mb-8 text-lg leading-relaxed"></p>
        <div id="notification-custom-content" class="w-full mb-8 empty:hidden"></div>
        <div class="flex gap-4 w-full justify-center">
          <button id="notification-cancel" class="btn secondary px-8 py-3 text-lg hidden">Cancel</button>
          <button id="notification-confirm" class="btn primary px-8 py-3 text-lg">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Global Loader Overlay -->
  <div id="global-loader" class="loader-overlay">
    <div class="spinner"></div>
    <p class="text-secondary" style="margin-top: 16px; font-weight: 500;">Loading...</p>
  </div>
</body>

</html>
